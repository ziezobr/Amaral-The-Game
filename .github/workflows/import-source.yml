name: Importar projeto Unity da release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-unity-source
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'ziezobr/Amaral-The-Game' && (github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v0.20.1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Baixar e verificar fontes da demo 0.20.1
        shell: bash
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/unity-source.zip" "https://github.com/ziezobr/Amaral-The-Game/releases/download/v0.20.1/Amaral-The-Game-0.20.1-Unity-Source.zip"
          echo "1fb1bc13658f9366ebd2720e7500a1e59b7027b974d1534d43fd01a0d23fe5cb  $RUNNER_TEMP/unity-source.zip" | sha256sum --check
      - name: Restaurar o projeto Unity
        shell: python
        run: |
          import os, pathlib, zipfile
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP']) / 'unity-source.zip') as z:
              for info in z.infolist():
                  relative = pathlib.PurePosixPath(info.filename)
                  if relative.is_absolute() or '..' in relative.parts or '.github' in relative.parts:
                      raise RuntimeError('Caminho de arquivo invalido')
                  if not (root / info.filename).resolve().is_relative_to(root):
                      raise RuntimeError('Arquivo fora do projeto')
              z.extractall(root)
      - name: Versionar fontes completas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Packages ProjectSettings Packaging Design Validation README.md .gitignore '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Importar projeto Unity completo da demo 0.20.1"
            git push origin HEAD:main
          fi
      - name: Associar a tag da demo ao projeto completo
        shell: bash
        run: |
          previous_tag="$(git ls-remote origin refs/tags/v0.20.1 | cut -f1)"
          if [ -n "$previous_tag" ]; then
            git push "--force-with-lease=refs/tags/v0.20.1:$previous_tag" origin HEAD:refs/tags/v0.20.1
          else
            git push origin HEAD:refs/tags/v0.20.1
          fi

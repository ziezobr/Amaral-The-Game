name: Publicar demo Windows 0.25.0
on:
  workflow_dispatch:
  push:
    paths:
      - Packaging/distribution-manifest.json
permissions:
  contents: write
concurrency:
  group: publish-demo-0250
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ziezobr/Amaral-The-Game'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ziezobr/Amaral-The-Game
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Identificar pacote preparado
        id: distribution
        shell: python
        run: |
          import json, os, pathlib
          data=json.loads(pathlib.Path('Packaging/distribution-manifest.json').read_text())
          assert data['version']=='0.25.0'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('commit='+data['stagingCommit']+'\n')
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.distribution.outputs.commit }}
          path: _release_staging
          persist-credentials: false
      - name: Reconstruir e verificar os pacotes
        shell: python
        run: |
          import hashlib,json,pathlib
          data=json.loads(pathlib.Path('Packaging/distribution-manifest.json').read_text())
          out=pathlib.Path('_release_output')
          out.mkdir(exist_ok=True)
          for asset in data['files']:
              digest=hashlib.sha256()
              position=0
              with (out/asset['name']).open('wb') as target:
                  for chunk in sorted(asset['chunks'],key=lambda c:c['offset']):
                      assert chunk['offset']==position
                      path=pathlib.PurePosixPath(chunk['path'])
                      assert path.parts[0]=='parts' and '..' not in path.parts
                      block=(pathlib.Path('_release_staging')/path).read_bytes()
                      assert len(block)==chunk['length']
                      target.write(block)
                      digest.update(block)
                      position+=len(block)
              assert position==asset['size']
              assert digest.hexdigest()==asset['sha256']
              print('SHA-256 OK: '+asset['name'])
          (out/'SHA256SUMS.txt').write_text(''.join(a['sha256']+'  '+a['name']+'\n' for a in data['files']))
      - name: Importar fontes completas da Unity
        shell: python
        run: |
          import pathlib,zipfile
          root=pathlib.Path.cwd().resolve()
          with zipfile.ZipFile('_release_output/Amaral-The-Game-0.25.0-Unity-Source.zip') as z:
              for info in z.infolist():
                  path=pathlib.PurePosixPath(info.filename)
                  assert not path.is_absolute() and '..' not in path.parts and '.github' not in path.parts
                  assert (root/info.filename).resolve().is_relative_to(root)
              z.extractall(root)
      - name: Versionar o projeto completo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets Packages ProjectSettings Packaging Design Validation README.md .gitignore '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Publicar projeto Unity completo da demo 0.25.0"
            git push origin HEAD:main
          fi
      - name: Preparar notas da demo
        shell: python
        run: |
          from pathlib import Path
          Path('_release_output/NOTES.md').write_text("""## Demo 2D 0.25.0 para Windows
          Instalador e ZIP portátil anexados. Extraia o ZIP inteiro para jogar sem instalar.

          ## Novidades
          Arte 2D coerente para protagonistas, Adryan criança, Mateus, Higor e Pivô.
          Oito tipos de pedestres, seis inimigos e oito modelos de carros redesenhados.
          Locomoção com 24 poses interpoladas por direção, mantendo oito direções e quadros-chave.
          São poses de animação 2D; não são 192 desenhos independentes de cada ataque.
          Amaral alterna corpo com câmera preta, rosa e mãos vazias.
          Recortes por contorno alfa completo, pés alinhados e bancos de arte por personagem.
          Trânsito usa circuitos nas faixas à direita, curvas amostradas e partida com espaçamento.
          Uber favorece a faixa correta e carros cedem pelo acostamento, sem desviar à esquerda.

          ## Atualizador
          O menu consulta as próximas releases, verifica SHA-256 e aplica a versão portátil com reinício.
          A opção automática pode ser adiada/desativada. Os saves são preservados fora da instalação.
          O auxiliar Windows mantém cópia dos arquivos anteriores para recuperação.

          ## Verificação
          75 testes de edição e 25 de execução aprovados, incluindo contratos, combate, coleta e viagem física do Uber.
          Revisão nativa 1080p de sprites, movimento, equipamento, cutscene, mapa e Uber.
          O auxiliar de atualização foi exercitado com cópia e backup em uma instalação de teste.
          Demo em desenvolvimento. Instalador sem assinatura digital.

          Projeto Unity completo e SHA256SUMS.txt anexados.
          """,encoding='utf-8')
      - name: Enviar arquivos e publicar a release
        shell: bash
        run: |
          if gh release view v0.25.0 >/dev/null 2>&1; then
            echo "A release ja existe; recusando sobrescrever uma publicacao existente."
            exit 1
          fi
          gh release create v0.25.0 --draft --target "$(git rev-parse HEAD)" --title "Amaral The Game — Demo 0.25.0 para Windows" --notes-file _release_output/NOTES.md
          gh release upload v0.25.0 _release_output/*.exe _release_output/*.zip _release_output/SHA256SUMS.txt
          gh release edit v0.25.0 --draft=false
      - name: Confirmar anexos publicados
        shell: python
        run: |
          import json,pathlib,subprocess
          release=json.loads(subprocess.check_output(['gh','api','repos/ziezobr/Amaral-The-Game/releases/tags/v0.25.0']))
          assert not release['draft']
          files=json.loads(pathlib.Path('Packaging/distribution-manifest.json').read_text())['files']
          assets={a['name']:a for a in release['assets']}
          for expected in files:
              actual=assets[expected['name']]
              assert actual['size']==expected['size']
              if actual.get('digest'):
                  assert actual['digest']=='sha256:'+expected['sha256']
          assert 'SHA256SUMS.txt' in assets
          print('PUBLICACAO_VERIFICADA: '+release['html_url'])
      - name: Remover somente a branch temporaria de envio
        shell: bash
        run: git push origin --delete release-upload-0250

